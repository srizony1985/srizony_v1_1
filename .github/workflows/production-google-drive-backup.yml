name: Neon to personal Google Drive JSON mirror

on:
  schedule:
    # Hourly incremental snapshots limit CI runner churn while keeping a practical recovery point.
    - cron: '0 * * * *'
    # Full snapshot at 02:35 Bangladesh time (includes high-churn analytics tables).
    - cron: '35 20 * * *'
  workflow_dispatch:
    inputs:
      full_snapshot:
        description: 'Include every public table, including high-churn analytics tables'
        required: false
        type: boolean
        default: false

concurrency:
  group: srizony-personal-drive-json-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DRIVE_JSON_FULL_SNAPSHOT: ${{ github.event.schedule == '35 20 * * *' && 'true' || (inputs.full_snapshot && 'true' || 'false') }}
      DRIVE_JSON_MAX_FILE_BYTES: ${{ vars.DRIVE_JSON_MAX_FILE_BYTES || '209715200' }}
      NEON_OBJECT_STORAGE_BUCKET: ${{ vars.NEON_OBJECT_STORAGE_BUCKET || 'uploads' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Install only backup runtime dependencies from the lockfile
        run: npm ci --omit=dev

      - name: Sync changed Neon tables to existing Drive JSON files
        run: npm run backup:google-drive
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY_BASE64 }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
